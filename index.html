<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎣 Rybářská hra - České ryby</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='48'%3E%F0%9F%8E%A3%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>🎣 Rybářská hra</h1>
            <div class="score-board">
                <div class="score">Skóre: <span id="score">0</span></div>
                <div class="fish-count">Ryby: <span id="fishCount">0</span></div>
                <div class="best-score">🏆 <span id="bestScore">0</span></div>
                <div class="coins">⭐ <span id="coins">0</span></div>
            </div>
            <div class="ui-buttons">
                <button class="icon-btn" id="toggleSound" title="Zvuk" aria-label="Zvuk">
                    <span id="soundIcon">🔊</span>
                </button>
                <button class="icon-btn" id="togglePause" title="Pauza" aria-label="Pauza">
                    <span id="pauseIcon">⏸️</span>
                </button>
                <button class="icon-btn" id="toggleMusic" title="Hudba" aria-label="Hudba">
                    <span id="musicIcon">🎵</span>
                </button>
                <button class="icon-btn" id="toggleSandbox" title="Dětský režim (Sandbox)" aria-label="Dětský režim">
                    <span>🧸</span>
                </button>
                <button class="icon-btn" id="toggleAutopilot" title="Autopilot" aria-label="Autopilot">
                    <span>🤖</span>
                </button>
                <button class="icon-btn" id="toggleTimer" title="Minutový souhrn" aria-label="Minutový souhrn">
                    <span>⏱️</span>
                </button>
                <button class="icon-btn" id="toggleRareMG" title="Vzácné ryby – minihra" aria-label="Vzácné ryby – minihra">
                    <span>🎮</span>
                </button>
                <button class="icon-btn" id="openAlbum" title="Album" aria-label="Album">
                    <span>📖</span>
                </button>
                <button class="icon-btn" id="cycleSkin" title="Skin prutu" aria-label="Skin prutu">
                    <span>🎨</span>
                </button>
                <button class="icon-btn" id="dailyReward" title="Odměna" aria-label="Odměna">
                    <span>🎁</span>
                </button>
                <button class="icon-btn" id="openPrefs" title="Nastavení" aria-label="Nastavení">
                    <span>⚙️</span>
                </button>
                <button class="icon-btn" id="openPhoto" title="Foto režim" aria-label="Foto režim">
                    <span>📷</span>
                </button>
            </div>
        </div>
        
        <div class="game-area">
            <canvas id="gameCanvas" width="1200" height="600"></canvas>
            <div class="vignette"></div>
            <div class="fisherman" id="fisherman">
                <div class="arms"></div>
                <div class="legs"></div>
                <div class="rod"></div>
                <div class="line" id="fishingLine"></div>
                <div class="hook" id="hook"></div>
            </div>
        </div>
        
        <div class="controls">
            <p aria-hidden="true" title="Ovládání">🖱️ ➡️ 🎣 | 👆 💦 | ⭐️🎉</p>
        </div>
        
        <div class="info-panel" id="infoPanel">
            <h3>Poslední úlovek:</h3>
            <div id="lastCatch">
                <p>Ještě jste nechytili žádnou rybu!</p>
            </div>
        </div>

        <div class="missions-panel" id="missionsPanel" aria-hidden="false"></div>

        <!-- Minihra zdolávání -->
        <div id="reelOverlay" class="reel-overlay" aria-hidden="true">
            <div class="reel-content">
                <div class="reel-emoji">🎣</div>
                <div class="reel-bar">
                    <div class="reel-goal" id="reelGoal"></div>
                    <div class="reel-progress" id="reelProgress"></div>
                </div>
                <div class="reel-hint" aria-hidden="true">👉👆</div>
            </div>
        </div>

        <!-- Album (Rybopedie) modal pro děti - pouze obrázky -->
        <div id="albumModal" class="album-modal" aria-hidden="true">
            <div class="album-content">
                <div class="album-header">
                    <span class="album-title" aria-hidden="true">📖</span>
                    <button class="icon-btn close" id="closeAlbum" aria-label="Zavřít">✖️</button>
                </div>
                <div id="albumGrid" class="album-grid"></div>
            </div>
        </div>

        <!-- Obchod se skiny prutu -->
        <div id="skinModal" class="shop-modal" aria-hidden="true">
            <div class="shop-content">
                <div class="shop-header">
                    <span class="shop-title" aria-hidden="true">🎨</span>
                    <button class="icon-btn close" id="closeSkin" aria-label="Zavřít">✖️</button>
                </div>
                <div id="skinGrid" class="shop-grid"></div>
            </div>
        </div>

        <!-- Denní odměna -->
        <div id="rewardModal" class="reward-modal" aria-hidden="true">
            <div class="reward-card">
                <div class="reward-emoji">🎁</div>
                <div class="reward-amount" id="rewardAmount">⭐ +0</div>
                <div style="margin-top:10px;">
                    <button class="icon-btn" id="closeReward" aria-label="Zavřít">✅</button>
                </div>
            </div>
        </div>

        <!-- Startovní odpočet -->
        <div id="countdown" class="countdown-overlay" aria-hidden="true">
            <div class="countdown-number" id="countdownNumber">3</div>
        </div>

        <!-- Panel preferencí (ikonové přepínače) -->
        <div id="prefsModal" class="prefs-modal" aria-hidden="true">
            <div class="prefs-card">
                <div class="prefs-grid">
                    <button class="toggle-btn" data-key="sound" title="Zvuky">🔊</button>
                    <button class="toggle-btn" data-key="music" title="Hudba">🎵</button>
                    <button class="toggle-btn" data-key="vignette" title="Vinětace">🖼️</button>
                    <button class="toggle-btn" data-key="sparkles" title="Třpytky">✨</button>
                    <button class="toggle-btn" data-key="silhouettes" title="Siluety">🐠</button>
                    <button class="toggle-btn" data-key="rays" title="Paprsky">☀️</button>
                    <button class="toggle-btn" data-key="particles" title="Prach">🍃</button>
                    <button class="toggle-btn" data-key="sandbox" title="Sandbox mód">🧸</button>
                    <button class="toggle-btn" data-key="autopilot" title="Autopilot">🤖</button>
                    <button class="toggle-btn" data-key="hints" title="Nápověda šipkou">🎯</button>
                </div>
                <div class="prefs-actions">
                    <button class="icon-btn" id="closePrefs" aria-label="Zavřít">✅</button>
                </div>
            </div>
        </div>

        <!-- Souhrn po 60s -->
        <div id="summaryModal" class="summary-modal" aria-hidden="true">
            <div class="summary-card">
                <div class="summary-row"><span>🐟</span><span id="sumFish">0</span></div>
                <div class="summary-row"><span>⭐</span><span id="sumCoins">0</span></div>
                <div class="summary-row"><span>🏅</span><span id="sumPoints">0</span></div>
                <div class="summary-actions"><button class="icon-btn" id="summaryContinue" aria-label="Pokračovat">▶️</button></div>
            </div>
        </div>

        <!-- Foto režim: jen malé tlačítko pro návrat -->
        <div id="photoOverlay" class="photo-overlay" aria-hidden="true">
            <button class="icon-btn close-photo" id="closePhoto" aria-label="Zpět">✅</button>
        </div>

</html>
